    // A deck that writes its slide into the address ('#3') would erase the key; keep the key beside it.
    const replace = history.replaceState.bind(history);
    history.replaceState = (s, t, u) => replace(s, t, typeof u === 'string' && /^#\d+$/.test(u) ? u + '&k=' + k : u);
    document.open(); document.write(html); document.close();
    // A relative link in the page opens another sealed page: give it the key. Links to other sites stay as they are.
    for (const a of document.querySelectorAll('a[href]')) {
      const h = a.getAttribute('href');
      if (!/^[a-z][a-z0-9+.-]*:|^\/\//i.test(h)) a.setAttribute('href', h + (h.includes('#') ? '&' : '#') + 'k=' + k);
    }
  } catch (e) {
    console.error('report: could not open', e);
    say('This link is not complete. Copy the full link, with the part after the # sign, and open it again.');
  }
})();
</script>
</body>
