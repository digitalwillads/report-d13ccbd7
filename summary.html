<script>
/* No top-level names: the page is written into this same window and declares its own. */
(async () => {
  const say = t => { document.getElementById('msg').textContent = t; };
  const bytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return say('This report is private. Open it with the full link you were sent.');
  if (!window.crypto || !crypto.subtle) return say('This browser cannot open the report. Open the link in an up-to-date Chrome, Safari, Edge or Firefox.');
  try {
    const box = document.getElementById('sealed');
    const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-CBC', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bytes(box.dataset.iv) }, key, bytes(box.textContent.trim()));
    const html = new TextDecoder().decode(plain);
    if (!/^\s*<!doctype html/i.test(html)) throw new Error('the key opened something that is not the report');
    // Before load, document.open() is ignored and the page lands inside this one (seen in Chrome, 2026-10-28).
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    // A deck that writes its slide into the address ('#3') would erase the key; keep the key beside it.
    const replace = history.replaceState.bind(history);
    history.replaceState = (s, t, u) => replace(s, t, typeof u === 'string' && /^#\d+$/.test(u) ? u + '&k=' + k : u);
    document.open(); document.write(html); document.close();
    // A relative link in the page opens another sealed page: give it the key. Links to other sites stay as they are.
    for (const a of document.querySelectorAll('a[href]')) {
      const h = a.getAttribute('href');
      if (!/^[a-z][a-z0-9+.-]*:|^\/\//i.test(h)) a.setAttribute('href', h + (h.includes('#') ? '&' : '#') + 'k=' + k);
    }
  } catch (e) {
    console.error('report: could not open', e);
    say('This link is not complete. Copy the full link, with the part after the # sign, and open it again.');
  }
})();
</script>
